# Project information
site_name: The Adventures of Ravenlost
site_author: Angela Bartz
site_url: https://abartzgit.github.io/ravenlost/

# Copyright
copyright: Copyright &copy; 2026 Angela Bartz

# Add extensions for Markdown processing, including support for attributes, Markdown in HTML, and admonitions.
markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - toc:
      toc_depth: 2

# Configuration
theme: 
  name: material
  logo: images/logo.png
  favicon: images/favicon.png

  # Auto-expand the left navigation and include previous and next navigation in the footer.
  features: 
    - navigation.expand
    - navigation.footer
  
  # Set the color palette for light and dark mode, and include a toggle to switch between them.
  palette:
    # Soft Dark Mode (Misty, shadowed library vibe)
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: deep purple
      toggle:
        icon: material/weather-fog
        name: Switch to light mode

    # Soft Light Mode (Aged parchment / morning fog vibe)
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: grey
      accent: deep purple
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

# Extras
extra:
  social:
    - icon: fontawesome/brands/discord
      link: https://discord.com/users/1125538089457160232
    - icon: fontawesome/brands/github
      link: https://github.com/ABartzGit/angelabartz
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/angela-bartz/

# Site navigation
nav: 
  - Chapter 1:
    - The Black Lantern Inn: chapter1/chapter-01-the-black-lantern-inn.md
    - Notes: chapter1/chapter-01-dnd-notes.md

